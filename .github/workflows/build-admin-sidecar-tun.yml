name: Build admin Sidecar TUN fix

on:
  push:
    branches:
      - fix/admin-sidecar-tun
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_INCREMENTAL: 0
  RUST_BACKTRACE: short
  HUSKY: 0
  NODE_OPTIONS: --max_old_space_size=4096

jobs:
  windows-x64-nsis:
    runs-on: windows-latest
    timeout-minutes: 90

    steps:
      - name: Checkout patched source
        uses: actions/checkout@v7

      - name: Install Rust 1.95.0
        uses: dtolnay/rust-toolchain@1.95.0
        with:
          targets: x86_64-pc-windows-msvc

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: . -> target
          key: admin-sidecar-tun-x64

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          run_install: false

      - name: Install Node.js 24.19.0
        uses: actions/setup-node@v7
        with:
          node-version: 24.19.0
          cache: pnpm

      - name: Install dependencies and official sidecars
        shell: pwsh
        run: |
          pnpm install --frozen-lockfile
          pnpm run prebuild x86_64-pc-windows-msvc

      - name: Run admin Sidecar TUN regression test
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force target | Out-Null
          rustc --edition=2024 --test src-tauri/src/core/manager/startup_policy.rs -o target/startup-policy-tests.exe
          & .\target\startup-policy-tests.exe

      - name: Run Sidecar startup event relay regression test
        shell: pwsh
        run: |
          cargo test -p clash-verge --lib core::manager::state --no-default-features --no-run --message-format=json-render-diagnostics > target\sidecar-test-artifacts.jsonl
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          $testExecutables = Get-Content target\sidecar-test-artifacts.jsonl |
            ForEach-Object { $_ | ConvertFrom-Json } |
            Where-Object { $_.reason -eq 'compiler-artifact' -and $_.target.name -eq 'app_lib' -and $_.profile.test -and $_.executable } |
            Select-Object -ExpandProperty executable -Unique
          if (@($testExecutables).Count -ne 1) {
            throw "Expected exactly one current app_lib test executable, got $(@($testExecutables).Count)"
          }
          $testExe = Get-Item -LiteralPath $testExecutables

          $manifest = "$($testExe.FullName).manifest"
          @'
          <?xml version="1.0" encoding="UTF-8" standalone="yes"?>
          <assembly xmlns="urn:schemas-microsoft-com:asm.v1" manifestVersion="1.0">
            <dependency>
              <dependentAssembly>
                <assemblyIdentity type="win32" name="Microsoft.Windows.Common-Controls" version="6.0.0.0" processorArchitecture="amd64" publicKeyToken="6595b64144ccf1df" language="*" />
              </dependentAssembly>
            </dependency>
          </assembly>
          '@ | Set-Content -LiteralPath $manifest -Encoding utf8

          $mt = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin\*\x64\mt.exe" |
            Sort-Object { [version]$_.Directory.Parent.Name } |
            Select-Object -Last 1
          if ($null -eq $mt) { throw "Windows SDK mt.exe was not found" }
          & $mt.FullName -nologo -manifest $manifest "-outputresource:$($testExe.FullName);#1"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          $testOutput = & $testExe.FullName "core::manager::state::" --nocapture 2>&1
          $testExitCode = $LASTEXITCODE
          $testOutput | Write-Output
          if ($testExitCode -ne 0) { exit $testExitCode }
          $summary = $testOutput | Where-Object { $_ -match '^test result: ok\. (\d+) passed;' } | Select-Object -Last 1
          $summaryMatch = [regex]::Match([string]$summary, '^test result: ok\. (\d+) passed;')
          if (-not $summaryMatch.Success -or [int]$summaryMatch.Groups[1].Value -lt 11) {
            throw "Expected at least 11 Sidecar state tests to run"
          }

      - name: Set identifiable development version
        run: pnpm release-version deploytest

      - name: Build unsigned Windows x64 NSIS installer
        shell: pwsh
        run: >-
          pnpm exec tauri build
          --target x86_64-pc-windows-msvc
          --bundles nsis
          --no-sign
          --ci
          --config src-tauri/tauri.unsigned.conf.json

      - name: Upload NSIS installer
        uses: actions/upload-artifact@v7
        with:
          name: clash-verge-admin-sidecar-tun-x64
          path: target/x86_64-pc-windows-msvc/release/bundle/nsis/*-setup.exe
          if-no-files-found: error
          archive: false
          retention-days: 14
